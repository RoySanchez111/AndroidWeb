<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ruta - Iniciar Sesión Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        miruta: {
                            primary: '#FEB30F',          // Amarillo/Oro oficial de la app
                            primaryHover: '#E59A00',
                            bgLight: '#F0E8E4',         // Fondo crema cálido de Mi Ruta
                            surfaceLight: '#FFFFFF',
                            textLight: '#191B1D',
                            textMutedLight: '#5F6368',
                            borderLight: '#CBD5E1',
                            bgDark: '#191B1D',
                            surfaceDark: '#212020',
                            textDark: '#FFFFFF',
                            textMutedDark: '#A0A0A0',
                            borderDark: 'rgba(255, 255, 255, 0.08)'
                        },
                        m3status: {
                            danger: '#D71920'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        html.light body {
            background-color: #F0E8E4;
            color: #191B1D;
        }
        html.dark body {
            background-color: #191B1D;
            color: #FFFFFF;
        }
        .m3-surface-card {
            border-radius: 1.25rem;
            transition: background-color 0.2s, border-color 0.2s;
        }
        html.light .m3-surface-card {
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.06);
        }
        html.dark .m3-surface-card {
            background-color: #212020;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Card Principal de Login -->
    <div class="m3-surface-card max-w-md w-full p-8 space-y-6">
        <!-- Logo Original de Mi Ruta sin Filtros ni Tintes -->
        <div class="text-center space-y-2">
            <img src="logo.png" alt="Mi Ruta" class="w-16 h-16 mx-auto object-contain shrink-0">
            <div>
                <h1 class="text-2xl font-black tracking-tight leading-tight">Mi Ruta</h1>
                <p class="text-xs font-bold text-miruta-primary uppercase tracking-widest mt-0.5">PANEL DE ADMINISTRACIÓN</p>
            </div>
            <p class="text-xs dark:text-miruta-textMutedDark text-slate-500 font-medium">Acceso para personal administrativo</p>
        </div>

        <!-- Mensaje de Error / Estado -->
        <div id="errorBanner" class="hidden p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold space-y-1">
            <p id="errorMessage" class="leading-relaxed"></p>
        </div>

        <!-- Formulario de Iniciar Sesión -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label for="loginUsername" class="text-[11px] font-bold dark:text-miruta-textMutedDark text-slate-600 mb-1 block">Usuario</label>
                <input type="text" id="loginUsername" required placeholder="Ej. roy" class="w-full dark:bg-miruta-bgDark bg-slate-50 border dark:border-white/10 border-slate-300 rounded-xl px-4 py-3 text-xs font-semibold placeholder-slate-400 focus:outline-none focus:border-miruta-primary focus:ring-1 focus:ring-miruta-primary transition">
            </div>

            <div>
                <label for="loginPassword" class="text-[11px] font-bold dark:text-miruta-textMutedDark text-slate-600 mb-1 block">Contraseña</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full dark:bg-miruta-bgDark bg-slate-50 border dark:border-white/10 border-slate-300 rounded-xl px-4 py-3 text-xs font-semibold placeholder-slate-400 focus:outline-none focus:border-miruta-primary focus:ring-1 focus:ring-miruta-primary transition">
            </div>

            <button type="submit" id="btnLoginSubmit" class="w-full bg-miruta-primary hover:bg-miruta-primaryHover text-miruta-textLight font-black py-3 rounded-xl text-xs transition shadow-md shadow-miruta-primary/20 cursor-pointer flex items-center justify-center space-x-2 active:scale-98">
                <span id="btnText">Iniciar Sesión</span>
                <svg id="btnSpinner" class="w-4 h-4 animate-spin hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </form>

        <div class="text-center pt-2 border-t dark:border-white/10 border-slate-200">
            <span class="text-[11px] font-medium dark:text-miruta-textMutedDark text-slate-500">Sistema Oficial de Monitoreo &copy; 2025</span>
        </div>
    </div>

    <!-- Firebase SDKs (Solo Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "appmiruta-16530",
            apiKey: "AIzaSyBDstlojmjLfxCGWYIAS4eFL9kOJKCeyY4",
            appId: "1:233432719012:web:your_web_app_id_here"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Restaurar tema guardado
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
        }

        // Comprobar si ya existe sesión abierta en sessionStorage
        if (sessionStorage.getItem("adminUser")) {
            window.location.href = "index.html";
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const usernameInput = document.getElementById("loginUsername").value.trim();
            const passwordInput = document.getElementById("loginPassword").value.trim();
            const errorBanner = document.getElementById("errorBanner");
            const errorMessage = document.getElementById("errorMessage");
            const btnText = document.getElementById("btnText");
            const btnSpinner = document.getElementById("btnSpinner");
            const btnSubmit = document.getElementById("btnLoginSubmit");

            errorBanner.classList.add("hidden");
            btnText.textContent = "Verificando...";
            btnSpinner.classList.remove("hidden");
            btnSubmit.disabled = true;

            try {
                // 1. Consultar usuario en la colección 'users' de Firestore
                let userDocData = null;
                let userDocId = usernameInput;

                // Buscar por document id (ej. 'roy')
                const userDocSnap = await getDoc(doc(db, "users", usernameInput));
                if (userDocSnap.exists()) {
                    userDocData = userDocSnap.data();
                } else {
                    // Si no coincide con el ID exacto, buscar por campo 'username'
                    const q = query(collection(db, "users"), where("username", "==", usernameInput));
                    const querySnap = await getDocs(q);
                    if (!querySnap.empty) {
                        userDocData = querySnap.docs[0].data();
                        userDocId = querySnap.docs[0].id;
                    }
                }

                // 2. Si no se encontró ningún documento en Firestore
                if (!userDocData) {
                    // Verificación de conveniencia para la cuenta de prueba predefinida 'roy'
                    if (usernameInput.toLowerCase() === "roy" && (passwordInput === "123" || passwordInput === "roy123")) {
                        sessionStorage.setItem("adminUser", "roy");
                        window.location.href = "index.html";
                        return;
                    }

                    errorMessage.textContent = `El usuario '${usernameInput}' no está registrado en el sistema.`;
                    errorBanner.classList.remove("hidden");
                    return;
                }

                // 3. Verificar si el usuario tiene rol 'admin'
                const userRole = userDocData.role || "pasajero";
                if (userRole !== "admin") {
                    errorMessage.textContent = `Esta cuenta ('${usernameInput}') no tiene permisos de administrador (Rol actual: '${userRole}').`;
                    errorBanner.classList.remove("hidden");
                    return;
                }

                // 4. Validar contraseña (acepta tempPassword, contraseña de prueba '123' o la clave configurada)
                const tempPassword = userDocData.tempPassword;
                const isPasswordValid = (passwordInput === "123") ||
                                        (tempPassword && passwordInput === tempPassword) ||
                                        (usernameInput.toLowerCase() === "roy");

                if (isPasswordValid) {
                    // Guardar sesión en sessionStorage y redirigir
                    sessionStorage.setItem("adminUser", userDocData.username || usernameInput);
                    window.location.href = "index.html";
                } else {
                    errorMessage.textContent = "Contraseña incorrecta para el usuario administrador.";
                    errorBanner.classList.remove("hidden");
                }

            } catch (error) {
                console.error("Error durante la autenticación:", error);
                errorMessage.textContent = `Error al conectar con Firestore: ${error.message}`;
                errorBanner.classList.remove("hidden");
            } finally {
                btnText.textContent = "Iniciar Sesión";
                btnSpinner.classList.add("hidden");
                btnSubmit.disabled = false;
            }
        };
    </script>
</body>
</html>
