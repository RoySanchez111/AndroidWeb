<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Ruta - Iniciar Sesión Admin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        miruta: {
                            primary: '#FEB30F',
                            primaryHover: '#E59A00',
                            bgLight: '#F0E8E4',
                            surfaceLight: '#FFFFFF',
                            textLight: '#191B1D',
                            textMutedLight: '#5F6368',
                            borderLight: '#CBD5E1',
                            bgDark: '#191B1D',
                            surfaceDark: '#212020',
                            textDark: '#FFFFFF',
                            textMutedDark: '#A0A0A0',
                            borderDark: 'rgba(255, 255, 255, 0.08)'
                        },
                        m3status: {
                            danger: '#D71920'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Estilos M3 Centralizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Card Principal de Login -->
    <div class="m3-surface-card max-w-md w-full p-8 space-y-6">
        <!-- Logo y Cabecera -->
        <div class="text-center space-y-2">
            <img src="logo.png" alt="Mi Ruta" class="w-16 h-16 mx-auto object-contain shrink-0">
            <div>
                <h1 class="text-2xl font-black tracking-tight leading-tight">Mi Ruta</h1>
                <p class="text-xs font-bold text-miruta-primary uppercase tracking-widest mt-0.5">PANEL DE ADMINISTRACIÓN</p>
            </div>
            <p class="text-xs dark:text-miruta-textMutedDark text-slate-500 font-medium">Acceso para personal administrativo</p>
        </div>

        <!-- Banner de Error / Estado -->
        <div id="errorBanner" class="hidden p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold space-y-1">
            <p id="errorMessage" class="leading-relaxed"></p>
        </div>

        <!-- Formulario de Iniciar Sesión -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="loginUsername" class="text-[11px] font-bold dark:text-miruta-textMutedDark text-slate-600 mb-1 block">Usuario</label>
                <input type="text" id="loginUsername" required autocomplete="username" placeholder="Ej. roy" class="w-full dark:bg-miruta-bgDark bg-slate-50 border dark:border-white/10 border-slate-300 rounded-xl px-4 py-3 text-xs font-semibold placeholder-slate-400 focus:outline-none focus:border-miruta-primary focus:ring-1 focus:ring-miruta-primary transition">
            </div>

            <div>
                <label for="loginPassword" class="text-[11px] font-bold dark:text-miruta-textMutedDark text-slate-600 mb-1 block">Contraseña</label>
                <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••" class="w-full dark:bg-miruta-bgDark bg-slate-50 border dark:border-white/10 border-slate-300 rounded-xl px-4 py-3 text-xs font-semibold placeholder-slate-400 focus:outline-none focus:border-miruta-primary focus:ring-1 focus:ring-miruta-primary transition">
            </div>

            <button type="submit" id="btnLoginSubmit" class="w-full bg-miruta-primary hover:bg-miruta-primaryHover text-miruta-textLight font-black py-3 rounded-xl text-xs transition shadow-md shadow-miruta-primary/20 cursor-pointer flex items-center justify-center space-x-2 active:scale-98 disabled:opacity-50">
                <span id="btnText">Iniciar Sesión</span>
                <svg id="btnSpinner" class="w-4 h-4 animate-spin hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </form>

        <div class="text-center pt-2 border-t dark:border-white/10 border-slate-200">
            <span class="text-[11px] font-medium dark:text-miruta-textMutedDark text-slate-500">Sistema Oficial de Monitoreo &copy; 2025</span>
        </div>
    </div>

    <!-- Módulo de Login ES -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
